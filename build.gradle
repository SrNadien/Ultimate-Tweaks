plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version =minecraft_version + "-" + mod_version + "-" + tag_lanzador
group = mod_group_id

base {
    archivesName = mod_name 
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

runs {
    configureEach {
        workingDirectory project.file('run')
        
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        
        modSource sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
        programArgument '--quickPlaySingleplayer'
        programArgument 'New World'
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    clientData {
        workingDirectory project.file('run-data')

        programArguments.addAll '--mod', mod_id,
                                '--all',
                                '--uncached',
                                '--output', file('src/generated/resources/').getAbsolutePath(),
                                '--existing', file('src/main/resources/').getAbsolutePath()
    }

    serverData {
        workingDirectory project.file('run-data')

        programArguments.addAll '--mod', mod_id,
                                '--all',
                                '--uncached',
                                '--output', file('src/generated/resources/').getAbsolutePath(),
                                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://maven.blamejared.com"
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
     maven {
        url = 'https://maven2.bai.lol'
        content {
            includeGroup 'lol.bai'
            includeGroup 'mcp.mobius.waila'
        }
    }
     maven { // TOP
        name 'tterrag maven'
        url "https://maven.tterrag.com/"
    }
    maven { url "https://maven.shedaniel.me" }
    maven { url 'https://maven.architectury.dev/' }
    maven {
        name = 'KubeJS'
        url = 'https://maven.latvian.dev/releases'
    }
    maven {
        name = "FTB"
        url = "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        name = 'AppleSkin'
        url = "https://maven.ryanliptak.com/"
    }
}  

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    
    
    //visores de recetas: JEI y REI se compilan, en runtime solo entra el elegido con recipe_viewer (jei, rei o none); EMI no existe para 26.1.2
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}") { transitive = false }
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}") { transitive = false }
    compileOnly("me.shedaniel.cloth:basic-math:0.6.1") { transitive = false }
    compileOnly("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }

    switch (recipe_viewer) {
        case 'jei':
            runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
            break
        case 'rei':
            runtimeOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}") { transitive = false }
            runtimeOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}") { transitive = false }
            runtimeOnly("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }
            break
        case 'none':
            break
        default:
            throw new GradleException("recipe_viewer debe ser jei, rei o none (es '${recipe_viewer}')")
    }

    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive = false }

    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"

    //jade
    implementation "maven.modrinth:jade:${jade_version}"


    // Ultimate Armoury declara geckolib, patchouli y appleskin como obligatorios: se necesitan
    // en el runtime de dev para que cargue, Tweaks no los usa en su codigo ni en su toml.
    runtimeOnly "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    runtimeOnly "vazkii.patchouli:patchouli-neoforge:${patchouli_version}"
    runtimeOnly "squeek.appleskin:appleskin-neoforge:mc${mc}-${appleskin_version}"

    // Ultimate Armoury es dependencia obligatoria de Tweaks: en dev entra al classpath de
    // runtime con el jar que se construye en su propia carpeta (./gradlew build -x test).
    runtimeOnly fileTree(dir: file("../UltimateArmoury Tools And Weapons (26.1.2)/build/libs"),
            include: 'UltimateArmoury*.jar', exclude: '*-sources.jar')
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_named: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
        jade_version: jade_version,
        jei_version: jei_version,
        kubejs_version_range: kubejs_version_range,
    ]
    
    inputs.properties replaceProperties
    
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title"     : mod_name,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        resources {
            exclude '.cache'
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
